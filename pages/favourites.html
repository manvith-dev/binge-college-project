<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binge - Favourites</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #fafafa;
            font-family: Arial, sans-serif;
        }

        #navbar {
            min-height: 10vh;
        }

        .favourites-main {
            width: 100%;
            max-width: 1280px;
            min-height: 75vh;
            margin: 0 auto;
            padding: 48px 20px;
        }

        #footer {
            width: 100%;
        }

        @media (min-width: 640px) {
            .favourites-main {
                padding: 64px 32px;
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <main class="favourites-main">
        <div id="favourites-grid"></div>
    </main>

    <div id="footer"></div>

    <script type="module" src="../js/favourites.js"></script>
</body>

</html>
