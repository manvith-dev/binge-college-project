<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Binge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #0a0a0a;
            color: #fafafa;
            font-family: Arial, sans-serif;
        }

        /* Hero slideshow */
        .hero {
            position: relative;
            height: 55vh;
            min-height: 360px;
            overflow: hidden;
            background: #262626;
        }

        #slides {
            position: absolute;
            inset: 0;
        }

        .hero-gradient-bottom,
        .hero-gradient-left {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hero-gradient-bottom {
            background: linear-gradient(to top,
                    #0a0a0a,
                    rgba(10, 10, 10, 0.4) 55%,
                    transparent);
        }

        .hero-gradient-left {
            background: linear-gradient(to right,
                    rgba(10, 10, 10, 0.8),
                    transparent 75%);
        }

        .hero-content {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px 40px;
        }

        .hero-label {
            margin: 0 0 8px;
            color: #a855f7;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .hero-title {
            max-width: 672px;
            margin: 0;
            font-size: 30px;
            font-weight: 700;
        }

        .hero-overview {
            display: -webkit-box;
            max-width: 576px;
            margin: 12px 0 0;
            overflow: hidden;
            color: #d4d4d4;
            font-size: 14px;
            line-height: 1.5;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            line-clamp: 2;
        }

        .hero-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            border-radius: 999px;
            background: #a855f7;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: filter 0.2s;
        }

        .hero-link:hover {
            filter: brightness(1.1);
        }

        .hero-dots {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        /* Main content */
        .movies-main {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 16px 64px;
        }

        /* Sticky search */
        .search-sticky {
            position: sticky;
            top: 0;
            z-index: 30;
            margin: 0 -16px;
            padding: 16px;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px);
        }

        .search-form {
            position: relative;
            max-width: 576px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 12px 48px 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            outline: none;
            background: #171717;
            color: #fafafa;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #737373;
        }

        .search-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.4);
        }

        .search-button {
            position: absolute;
            top: 50%;
            right: 8px;
            display: flex;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
            border: none;
            border-radius: 50%;
            background: #a855f7;
            color: #fff;
            cursor: pointer;
            transition: filter 0.2s;
        }

        .search-button:hover {
            filter: brightness(1.1);
        }

        .search-button svg {
            width: 16px;
            height: 16px;
        }

        /* Movie grid */
        .grid-title {
            margin: 16px 0 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .movie-status {
            padding: 40px 0;
            color: #a3a3a3;
            text-align: center;
        }

        /* Pagination */
        .load-more-container {
            margin-top: 24px;
            text-align: center;
        }

        .load-more-button {
            padding: 12px 32px;
            border: 1px solid #a855f7;
            border-radius: 999px;
            background: transparent;
            color: #c084fc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .load-more-button:hover {
            background: #a855f7;
            color: #fff;
        }

        .load-more-button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .hidden {
            display: none !important;
        }

        @media (min-width: 640px) {
            .hero-content {
                padding-right: 24px;
                padding-left: 24px;
            }

            .hero-title {
                font-size: 48px;
            }

            .hero-overview {
                font-size: 16px;
            }

            .movies-main {
                padding-right: 24px;
                padding-left: 24px;
            }

            .search-sticky {
                margin-right: -24px;
                margin-left: -24px;
                padding-right: 24px;
                padding-left: 24px;
            }

            .grid-title {
                font-size: 24px;
            }

            .movie-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 24px;
            }
        }

        @media (min-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            .movie-grid {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }

        @media (min-width: 1280px) {
            .movie-grid {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <!-- Background slideshow -->
    <section id="hero" class="hero">
        <div id="slides"></div>

        <div class="hero-gradient-bottom"></div>
        <div class="hero-gradient-left"></div>

        <div class="hero-content">
            <p class="hero-label">Trending now</p>

            <h1 id="hero-title" class="hero-title">
                Loading…
            </h1>

            <p id="hero-overview" class="hero-overview"></p>

            <a id="hero-link" href="#" class="hero-link">
                View details
            </a>

            <div id="dots" class="hero-dots"></div>
        </div>
    </section>

    <main class="movies-main">

        <!-- Search bar -->
        <div class="search-sticky">
            <form id="search-form" class="search-form">
                <input id="search-input" class="search-input" type="search" placeholder="Search movies…"
                    autocomplete="off">

                <button type="submit" class="search-button" aria-label="Search">
                    <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path stroke-linecap="round" d="m20 20-3.5-3.5"></path>
                    </svg>
                </button>
            </form>
        </div>

        <h2 id="grid-title" class="grid-title">
            Popular movies
        </h2>

        <div id="grid" class="movie-grid"></div>

        <p id="status" class="movie-status"></p>

        <div class="load-more-container">
            <button id="load-more" class="load-more-button hidden">
                Load more
            </button>
        </div>

    </main>

    <script type="module" src="../js/movies.js"></script>
</body>

</html>
