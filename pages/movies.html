<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies | Binge</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body class="min-h-screen bg-neutral-950 text-neutral-50">

    <div id="navbar"></div>

    <!-- Background slideshow -->
    <section id="hero" class="relative h-[55vh] min-h-[360px] overflow-hidden bg-neutral-900">
        <div id="slides"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-neutral-950/80 via-transparent to-transparent"></div>

        <div class="absolute inset-x-0 bottom-0 mx-auto max-w-7xl px-4 pb-10 sm:px-6">
            <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-accent">Trending now</p>
            <h1 id="hero-title" class="max-w-2xl text-3xl font-bold sm:text-5xl">Loading…</h1>
            <p id="hero-overview" class="mt-3 line-clamp-2 max-w-xl text-sm text-neutral-300 sm:text-base"></p>
            <a id="hero-link" href="#"
                class="mt-5 inline-block rounded-full bg-accent px-6 py-2.5 text-sm font-semibold transition hover:brightness-110">
                View details
            </a>
            <div id="dots" class="mt-6 flex gap-2"></div>
        </div>
    </section>

    <main class="mx-auto max-w-7xl px-4 pb-16 sm:px-6">

        <!-- Search bar -->
        <div class="sticky top-0 z-30 -mx-4 bg-neutral-950/90 px-4 py-4 backdrop-blur sm:-mx-6 sm:px-6">
            <form id="search-form" class="relative mx-auto max-w-xl">
                <input id="search-input" type="search" placeholder="Search movies…" autocomplete="off"
                    class="w-full rounded-full border border-white/10 bg-neutral-900 px-5 py-3 pr-12 text-sm
                              placeholder-neutral-500 outline-none transition focus:border-accent focus:ring-2 focus:ring-accent/40">
                <button type="submit" aria-label="Search"
                    class="absolute right-2 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-full bg-accent transition hover:brightness-110">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7" />
                        <path stroke-linecap="round" d="m20 20-3.5-3.5" />
                    </svg>
                </button>
            </form>
        </div>

        <h2 id="grid-title" class="mb-5 mt-4 text-xl font-bold sm:text-2xl">Popular movies</h2>

        <div id="grid"
            class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-6 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6"></div>

        <p id="status" class="py-10 text-center text-neutral-400"></p>

        <div class="text-center">
            <button id="load-more"
                class="hidden rounded-full border border-accent px-8 py-3 text-sm font-semibold text-accent transition hover:bg-accent hover:text-white">
                Load more
            </button>
        </div>
    </main>

    <script type="module" src="../js/movies.js"></script>
</body>

</html>
